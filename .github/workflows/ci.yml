name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate lockfile when absent
        if: ${{ !hashFiles('package-lock.json') }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Security boundary scan
        run: npm run security:boundaries
      - name: Secret scan
        run: node scripts/check-secrets.mjs
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !hashFiles('package-lock.json') == false }}
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push

  windows-sandbox:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate lockfile when absent
        if: ${{ !hashFiles('package-lock.json') }}
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Build native helper
        shell: pwsh
        run: |
          cmake -S native/windows-job -B native/windows-job/build
          cmake --build native/windows-job/build --config Release
      - name: Configure sandbox test environment
        shell: pwsh
        run: |
          "TONI_JOB_HELPER_PATH=$env:GITHUB_WORKSPACE\native\windows-job\build\Release\toni-job.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TONI_TRUSTED_INSTALL_ROOT=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Security boundary scan
        run: npm run security:boundaries
      - name: Secret scan
        run: node scripts/check-secrets.mjs
